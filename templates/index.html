<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Avatar Tag Editor PRO</title>
<link rel="stylesheet" href="/static/style.css" />
</head>
<body>

<header class="topbar">
  <div class="brand">Avatar Tag Editor <span class="pro">PRO</span></div>

  <div class="folder-control">
    <button id="btnChooseFolder" class="btn btn-ghost">📁 Рабочая папка</button>
    <span id="folderLabel" class="folder-label">не выбрана</span>
  </div>

  <nav class="tabs">
    <button class="tab-btn active" data-tab="tagging">Разметка</button>
    <button class="tab-btn" data-tab="search">Поиск и загрузка</button>
  </nav>
</header>

<!-- ==================== ВКЛАДКА: РАЗМЕТКА ==================== -->
<main id="tab-tagging" class="tab-panel active">
  <div class="tagging-layout">

    <section class="viewer">
      <div class="viewer-toolbar">
        <label class="switch">
          <input type="checkbox" id="onlyUntagged" checked />
          <span>Только неразмеченные</span>
        </label>
        <div id="progressLabel" class="progress-label">0/0</div>
      </div>

      <div class="image-frame">
        <img id="mainImage" alt="" />
        <div id="emptyState" class="empty-state hidden">
          <div class="empty-icon">✓</div>
          <div>Все изображения обработаны</div>
        </div>
      </div>

      <div class="filename-row">
        <span id="filenameLabel" class="filename">—</span>
        <span id="bucketBadge" class="badge hidden"></span>
      </div>

      <div class="rename-row">
        <input id="bucketInput" list="bucketList" placeholder="имя бакета (напр. hiro)" />
        <datalist id="bucketList"></datalist>
        <button id="btnRenameBucket" class="btn">Переименовать → бакет_N</button>
        <button id="btnRenameFree" class="btn btn-ghost">Свободное имя…</button>
        <button id="btnDelete" class="btn btn-danger">🗑 Удалить</button>
      </div>

      <div id="presetBanner" class="preset-banner hidden">
        <span id="presetText"></span>
        <button id="btnSavePreset" class="btn btn-small">💾 Сохранить как пресет бакета</button>
      </div>

      <div class="tags-editor">
        <div id="chipsBox" class="chips-box" tabindex="0">
          <div id="chips"></div>
          <input id="tagInput" placeholder="введите тег и Enter…" autocomplete="off" />
          <div id="suggestBox" class="suggest-box hidden"></div>
        </div>
      </div>

      <div class="quick-tags">
        <div class="quick-tags-label">Частые теги бакета <span class="hint">(Alt+1…9)</span></div>
        <div id="quickTags" class="quick-tags-list"></div>
      </div>

      <div class="nav-row">
        <button id="btnPrev" class="btn btn-ghost">◀ Назад</button>
        <button id="btnCopyPrev" class="btn btn-ghost">Скопировать из пред. в бакете</button>
        <button id="btnSkip" class="btn btn-ghost">Пропустить ▶</button>
        <button id="btnSaveNext" class="btn btn-primary">Сохранить и дальше (Enter)</button>
      </div>
    </section>
  </div>
</main>

<!-- ==================== ВКЛАДКА: ПОИСК ==================== -->
<main id="tab-search" class="tab-panel">
  <div class="search-toolbar">
    <input id="searchQuery" placeholder="поисковый запрос…" />
    <select id="searchEngine">
      <option value="google">Google</option>
      <option value="yandex">Yandex</option>
      <option value="both">Оба</option>
    </select>
    <input id="searchCount" type="number" value="20" min="5" max="60" title="Количество" />
    <label class="switch inline">
      <input type="checkbox" id="squareOnly" checked />
      <span>Только квадратные</span>
    </label>
    <button id="btnSearch" class="btn btn-primary">Искать</button>
    <button id="btnLoadMore" class="btn btn-ghost">Ещё</button>
  </div>

  <div class="search-toolbar">
    <input id="searchBucket" list="bucketList2" placeholder="бакет для сохранения" />
    <datalist id="bucketList2"></datalist>
    <input id="searchTags" placeholder="теги для новых файлов…" style="flex:1" />
    <button id="btnSelectAll" class="btn btn-ghost">Выделить все</button>
    <button id="btnSelectNone" class="btn btn-ghost">Снять все</button>
    <button id="btnDownload" class="btn btn-primary">Скачать отмеченные</button>
  </div>

  <div id="searchStatus" class="search-status"></div>
  <div id="searchGrid" class="search-grid"></div>
</main>

<div id="toast" class="toast hidden"></div>

<!-- модалка выбора папки -->
<div id="folderModal" class="modal hidden">
  <div class="modal-card">
    <div class="modal-title">Выбор рабочей папки</div>
    <div id="browsePath" class="browse-path"></div>
    <div id="browseList" class="browse-list"></div>
    <div class="modal-actions">
      <button id="btnBrowseUp" class="btn btn-ghost">⬆ Вверх</button>
      <button id="btnBrowseChoose" class="btn btn-primary">Выбрать эту папку</button>
      <button id="btnBrowseCancel" class="btn btn-ghost">Отмена</button>
    </div>
  </div>
</div>

<!-- модалка свободного переименования -->
<div id="renameModal" class="modal hidden">
  <div class="modal-card small">
    <div class="modal-title">Новое имя файла</div>
    <input id="renameFreeInput" placeholder="новое_имя.jpg" />
    <div class="modal-actions">
      <button id="btnRenameFreeConfirm" class="btn btn-primary">Переименовать</button>
      <button id="btnRenameFreeCancel" class="btn btn-ghost">Отмена</button>
    </div>
  </div>
</div>

<script src="/static/app.js"></script>
</body>
</html>
